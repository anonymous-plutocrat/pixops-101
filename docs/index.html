<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body style="margin:0">
<title>Pixel Ops</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Carbon v11 shell: 48px header, 256px side nav of operations, a wizard column with a vertical
   progress indicator (operation → code → output), and a sticky image panel on the right.
   Tokens follow Carbon's White theme (light) and Gray 100 theme (dark). */
:root{
  --cds-background:#ffffff; --cds-layer-01:#f4f4f4; --cds-layer-02:#ffffff; --cds-layer-accent:#e0e0e0;
  --cds-layer-hover:#e8e8e8; --cds-layer-selected:#e0e0e0; --cds-field:#f4f4f4;
  --cds-border-subtle:#e0e0e0; --cds-border-subtle-strong:#c6c6c6; --cds-border-strong:#8d8d8d; --cds-border-inverse:#161616;
  --cds-text-primary:#161616; --cds-text-secondary:#525252; --cds-text-helper:#6f6f6f; --cds-text-placeholder:#a8a8a8;
  --cds-text-on-color:#ffffff; --cds-text-inverse:#ffffff; --cds-layer-selected-inverse:#161616;
  --cds-interactive:#0f62fe; --cds-link:#0f62fe; --cds-focus:#0f62fe; --cds-icon-primary:#161616; --cds-icon-secondary:#525252;
  --cds-button-primary:#0f62fe; --cds-button-primary-hover:#0050e6; --cds-button-primary-active:#002d9c;
  --cds-button-secondary:#393939; --cds-button-secondary-hover:#474747;
  --cds-highlight:#d0e2ff; --cds-tag-bg:#edf5ff; --cds-tag-fg:#0043ce; --cds-tag-hl-bg:#d0e2ff; --cds-tag-hl-fg:#002d9c; --cds-tag-radius:2px;
  --cds-tag-shadow:inset 0 0 0 1px #a6c8ff; --cds-tag-hl-shadow:inset 0 0 0 1px #4589ff;
  --cds-info-bg:#edf5ff; --cds-info-border:#0043ce;
  --cds-tip-bg:#393939; --cds-tip-fg:#ffffff; --cds-tip-muted:#c6c6c6; --cds-tip-err:#ff8389;
  --cds-error:#da1e28; --cds-error-bg:#fff1f1;
  --cds-shell:#161616; --cds-shell-fg:#f4f4f4; --cds-shell-hover:#2c2c2c; --cds-shell-border:#393939;
  --cds-overlay:rgba(22,22,22,.5);
  --ch-r:#da1e28; --ch-g:#198038; --ch-b:#0f62fe;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --hdr:48px;
  /* aliases used by the shared chart code */
  --fg:var(--cds-text-primary); --bg:var(--cds-background); --muted:var(--cds-text-secondary); --faint:var(--cds-border-subtle-strong);
  --line:var(--cds-border-subtle); --frame:var(--cds-layer-01);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cds-background:#161616; --cds-layer-01:#262626; --cds-layer-02:#393939; --cds-layer-accent:#393939;
    --cds-layer-hover:#333333; --cds-layer-selected:#393939; --cds-field:#262626;
    --cds-border-subtle:#393939; --cds-border-subtle-strong:#525252; --cds-border-strong:#6f6f6f; --cds-border-inverse:#f4f4f4;
    --cds-text-primary:#f4f4f4; --cds-text-secondary:#c6c6c6; --cds-text-helper:#a8a8a8; --cds-text-placeholder:#6f6f6f;
    --cds-text-inverse:#161616; --cds-layer-selected-inverse:#f4f4f4;
    --cds-interactive:#4589ff; --cds-link:#78a9ff; --cds-focus:#ffffff; --cds-icon-primary:#f4f4f4; --cds-icon-secondary:#c6c6c6;
    --cds-button-secondary:#6f6f6f; --cds-button-secondary-hover:#5e5e5e;
    --cds-highlight:#002d9c; --cds-tag-bg:#393939; --cds-tag-fg:#f4f4f4; --cds-tag-hl-bg:#474747; --cds-tag-hl-fg:#f4f4f4; --cds-tag-radius:0;
    --cds-tag-shadow:inset 0 -1px 0 #6f6f6f; --cds-tag-hl-shadow:inset 0 -1px 0 #8d8d8d;
    --cds-info-bg:#262626; --cds-info-border:#4589ff;
    --cds-tip-bg:#f4f4f4; --cds-tip-fg:#161616; --cds-tip-muted:#525252; --cds-tip-err:#da1e28;
    --cds-error:#fa4d56; --cds-error-bg:#2d0709;
    --cds-overlay:rgba(0,0,0,.65);
    --ch-r:#fa4d56; --ch-g:#42be65; --ch-b:#4589ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --cds-background:#161616; --cds-layer-01:#262626; --cds-layer-02:#393939; --cds-layer-accent:#393939;
  --cds-layer-hover:#333333; --cds-layer-selected:#393939; --cds-field:#262626;
  --cds-border-subtle:#393939; --cds-border-subtle-strong:#525252; --cds-border-strong:#6f6f6f; --cds-border-inverse:#f4f4f4;
  --cds-text-primary:#f4f4f4; --cds-text-secondary:#c6c6c6; --cds-text-helper:#a8a8a8; --cds-text-placeholder:#6f6f6f;
  --cds-text-inverse:#161616; --cds-layer-selected-inverse:#f4f4f4;
  --cds-interactive:#4589ff; --cds-link:#78a9ff; --cds-focus:#ffffff; --cds-icon-primary:#f4f4f4; --cds-icon-secondary:#c6c6c6;
  --cds-button-secondary:#6f6f6f; --cds-button-secondary-hover:#5e5e5e;
  --cds-highlight:#002d9c; --cds-tag-bg:#393939; --cds-tag-fg:#f4f4f4; --cds-tag-hl-bg:#474747; --cds-tag-hl-fg:#f4f4f4; --cds-tag-radius:0;
    --cds-tag-shadow:inset 0 -1px 0 #6f6f6f; --cds-tag-hl-shadow:inset 0 -1px 0 #8d8d8d;
  --cds-info-bg:#262626; --cds-info-border:#4589ff;
    --cds-tip-bg:#f4f4f4; --cds-tip-fg:#161616; --cds-tip-muted:#525252; --cds-tip-err:#da1e28;
    --cds-error:#fa4d56; --cds-error-bg:#2d0709;
  --cds-overlay:rgba(0,0,0,.65);
  --ch-r:#fa4d56; --ch-g:#42be65; --ch-b:#4589ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--cds-background);color:var(--cds-text-primary);font:400 14px/1.43 var(--sans);letter-spacing:.16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--cds-shell)}
h1,h2,h3{margin:0;font-family:var(--sans);text-wrap:balance}
p{margin:0}
button,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--cds-focus);outline-offset:-2px}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;fill:currentColor;flex:none}

/* ---------- UI shell header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--hdr);background:var(--cds-shell);color:var(--cds-shell-fg);display:flex;align-items:stretch;border-bottom:1px solid var(--cds-shell-border);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.hdr-btn{width:48px;border:0;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer}
.hdr-btn:hover{background:var(--cds-shell-hover)}
.hdr-btn:focus-visible{outline:2px solid #ffffff;outline-offset:-2px}
.hdr-btn svg.i{width:20px;height:20px}
#menuBtn{display:none}
.hdr-name{display:flex;align-items:center;gap:6px;padding:0 32px 0 16px;color:inherit;text-decoration:none;font:600 14px/18px var(--sans);white-space:nowrap}
.hdr-name span{font-weight:400}
.hdr-name:focus-visible{outline:2px solid #ffffff;outline-offset:-2px}
.hdr-crumb{display:flex;align-items:center;font:400 14px/18px var(--sans);color:#c6c6c6;border-left:1px solid var(--cds-shell-border);padding:0 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hdr-spacer{flex:1}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr) minmax(320px,400px);align-items:start}

/* side nav */
.nav{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--cds-layer-01);border-right:1px solid var(--cds-border-subtle);padding:16px 0 32px;padding-left:env(safe-area-inset-left,0px)}
.nav-group + .nav-group{margin-top:16px}
.nav-cat{padding:0 16px 4px}
.nav-cat h2{font:600 14px/18px var(--sans);color:var(--cds-text-primary)}
.nav-cat span{display:block;font:400 12px/16px var(--sans);letter-spacing:.32px;color:var(--cds-text-helper)}
.nav ol{list-style:none;margin:4px 0 0;padding:0}
.nav a{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;padding:7px 16px 7px 32px;color:var(--cds-text-secondary);text-decoration:none;font:600 14px/18px var(--sans)}
.nav a:hover{background:var(--cds-layer-hover);color:var(--cds-text-primary)}
.nav a.on{background:var(--cds-layer-selected);color:var(--cds-text-primary)}
.nav a.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cds-interactive)}
.nav a .chk{opacity:0;color:var(--cds-interactive)}
.nav a.done .chk{opacity:1}
.nav .sheet-src{display:none}
.overlay{display:none}

/* wizard */
.wizard{min-width:0;padding:32px 40px 72vh}
.wz-head{display:flex;flex-direction:column;gap:8px;margin-bottom:32px;max-width:720px}
.eyebrow{font:400 12px/16px var(--sans);letter-spacing:.32px;color:var(--cds-text-secondary)}
.wz-head h1{font:400 32px/40px var(--sans);letter-spacing:0}

/* vertical progress indicator */
.steps{display:flex;flex-direction:column;max-width:760px}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:16px;position:relative;padding-bottom:40px;scroll-margin-top:calc(var(--hdr) + 24px)}
.step::before{content:"";position:absolute;left:11px;top:28px;bottom:4px;width:1px;background:var(--cds-border-subtle-strong)}
.step.complete::before{background:var(--cds-interactive)}
.step:last-child::before{display:none}
.step-ic{width:24px;height:24px;display:grid;place-items:center;color:var(--cds-interactive);padding-top:2px}
.step-ic svg{width:20px;height:20px;fill:currentColor}
.step-body{display:flex;flex-direction:column;gap:16px;min-width:0}
.step-label{display:flex;flex-direction:column;gap:2px}
.step-label h2{font:400 20px/28px var(--sans);letter-spacing:0}
.step-body > p{font:400 16px/24px var(--sans);letter-spacing:0;color:var(--cds-text-primary);max-width:66ch}
.step-body > p.helper{font:400 14px/20px var(--sans);letter-spacing:.16px;color:var(--cds-text-secondary)}
.step.enter{animation:enter .24s cubic-bezier(0,0,.38,.9) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:space-between;gap:32px;min-height:48px;padding:13px 16px 13px 16px;border:1px solid transparent;border-radius:0;font:400 14px/18px var(--sans);letter-spacing:.16px;text-decoration:none;cursor:pointer;text-align:left;max-width:100%}
.btn svg.i{margin-left:auto}
.btn-primary{background:var(--cds-button-primary);color:#ffffff}
.btn-primary:hover{background:var(--cds-button-primary-hover)}
.btn-primary:active{background:var(--cds-button-primary-active)}
.btn-secondary{background:var(--cds-button-secondary);color:#ffffff}
.btn-secondary:hover{background:var(--cds-button-secondary-hover)}
.btn-ghost{background:transparent;color:var(--cds-link);padding-right:16px}
.btn-ghost:hover{background:var(--cds-layer-hover)}
.btn-sm{min-height:32px;padding:6px 12px;gap:16px}
.btn:focus-visible{outline:2px solid var(--cds-focus);outline-offset:-2px;box-shadow:inset 0 0 0 3px var(--cds-background)}
.actions{display:flex;flex-wrap:wrap;gap:1px}

/* code snippet with contained tabs */
.snippet{background:var(--cds-layer-01);min-width:0}
.tabs{display:flex;align-items:stretch;background:var(--cds-layer-accent);overflow-x:auto}
.tab{position:relative;display:flex;align-items:center;min-width:128px;height:48px;padding:0 16px;border:0;background:var(--cds-layer-accent);color:var(--cds-text-secondary);text-align:left;cursor:pointer;font:400 14px/18px var(--sans);border-right:1px solid var(--cds-border-strong)}
.tab:last-child{border-right:0}
.tab:hover{background:var(--cds-layer-hover);color:var(--cds-text-primary)}
.tab[aria-selected="true"]{background:var(--cds-layer-01);color:var(--cds-text-primary);font-weight:600;border-right-color:transparent}
.tab[aria-selected="true"]::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--cds-interactive)}
.tab.static{cursor:default}
.tab.static:hover{background:var(--cds-layer-01)}
.tabs-note{margin-left:auto;align-self:center;padding:0 16px;font:400 12px/16px var(--sans);letter-spacing:.32px;color:var(--cds-text-secondary);white-space:nowrap}
.code{margin:0;padding:16px;color:var(--cds-text-primary);font:400 14px/24px var(--mono);letter-spacing:.32px;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4}
.code .tk{cursor:help;border-bottom:1px dotted var(--cds-border-strong)}
.code .tk:hover,.code .tk.hl{background:var(--cds-highlight);border-bottom:1px solid var(--cds-interactive)}
.code .pm{background:var(--cds-tag-bg);color:var(--cds-tag-fg);border-radius:2px;padding:1px 6px;margin:0 1px;font-weight:600;cursor:pointer}
.code .pm{box-shadow:var(--cds-tag-shadow);border-radius:var(--cds-tag-radius)}
.code .pm:hover,.code .pm.hl{background:var(--cds-tag-hl-bg);color:var(--cds-tag-hl-fg);box-shadow:var(--cds-tag-hl-shadow)}
.code .cm{color:var(--cds-text-helper)}
.code .cm.tk{color:var(--cds-text-helper)}
.code .tk:focus-visible,.code .pm:focus-visible{outline:2px solid var(--cds-focus);outline-offset:1px}


/* editable values inside the code */
.code .pm{display:inline-flex;align-items:baseline;position:relative;padding:0;cursor:text}
.code .pm-in,.code .pm-sel{font:600 14px/22px var(--mono);letter-spacing:.32px;color:inherit;background:transparent;border:0;padding:0 6px;margin:0;min-width:2ch;border-radius:var(--cds-tag-radius);outline:none}
.code .pm-in{cursor:text;caret-color:currentColor}
.code .pm-sel{-webkit-appearance:none;appearance:none;padding-right:20px;cursor:pointer}
.code .pm-sel option{background:var(--cds-layer-01);color:var(--cds-text-primary)}
.code .pm .chev{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:14px;height:14px;pointer-events:none}
.code .pm:focus-within{background:var(--cds-layer-02);color:var(--cds-text-primary);box-shadow:inset 0 0 0 2px var(--cds-focus)}
.code .pm.bad,.code .pm.bad:focus-within{background:var(--cds-error-bg);color:var(--cds-error);box-shadow:inset 0 0 0 2px var(--cds-error)}
.code .pm.ro{padding:0 6px;cursor:help}
.code .pm.ro:hover,.code .pm.ro:focus-visible{background:var(--cds-tag-hl-bg);color:var(--cds-tag-hl-fg)}
/* output note for two-step pages */
.result{display:flex;flex-direction:column;gap:8px;padding:16px 16px 16px 13px;border-left:3px solid var(--cds-interactive);background:var(--cds-layer-01);scroll-margin-top:calc(var(--hdr) + 24px)}
.result > p{font:400 16px/24px var(--sans);letter-spacing:0;max-width:66ch}
.result .nextrow{border-top:0;margin-top:8px;padding-top:0}
/* notebook-style cell footer */
.cell-foot{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:0 16px 16px}
.cell-foot .btn{min-height:40px;padding:10px 16px;gap:24px}
.cell-status{font:400 12px/16px var(--mono);letter-spacing:.32px;color:var(--cds-text-secondary)}
/* reset icon button in the tab bar */
.tbtn{flex:none;width:48px;height:48px;border:0;background:transparent;color:var(--cds-icon-primary);display:grid;place-items:center;cursor:pointer}
.tbtn:hover:not(:disabled){background:var(--cds-layer-hover)}
.tbtn:disabled{color:var(--cds-text-placeholder);cursor:not-allowed}
.tbtn svg.i{width:16px;height:16px}
/* Carbon tooltip */
.tip{position:fixed;z-index:80;max-width:min(288px, calc(100vw - 16px));display:flex;flex-direction:column;gap:4px;padding:8px 16px;background:var(--cds-tip-bg);color:var(--cds-tip-fg);border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.3);font:400 14px/18px var(--sans);letter-spacing:.16px;pointer-events:none}
.tip .k{font:600 13px/18px var(--mono);overflow-wrap:anywhere}
.tip .note{color:var(--cds-tip-muted);font-size:12px;line-height:16px;letter-spacing:.32px}
.tip .err{color:var(--cds-tip-err);font-size:12px;line-height:16px;letter-spacing:.32px}
.tip .caret{position:absolute;left:var(--cx,50%);bottom:-5px;width:10px;height:10px;margin-left:-5px;background:var(--cds-tip-bg);transform:rotate(45deg)}
.tip.below .caret{bottom:auto;top:-5px}
@media (prefers-reduced-motion:no-preference){.tip{animation:tipin .11s cubic-bezier(0,0,.38,.9)}@keyframes tipin{from{opacity:0}to{opacity:1}}}

/* explanation: low-contrast inline notification */
.explain{display:flex;gap:12px;align-items:flex-start;background:var(--cds-info-bg);border-left:3px solid var(--cds-info-border);padding:14px 16px 14px 13px;min-height:64px;margin:0 16px 16px}
.explain svg.i{color:var(--cds-info-border);margin-top:2px}
.explain .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.explain .k{font:600 14px/20px var(--mono);color:var(--cds-text-primary);overflow-wrap:anywhere}
.explain .v{font:400 14px/20px var(--sans);color:var(--cds-text-primary)}
.explain .v em{font-style:normal;color:var(--cds-text-secondary)}

/* parameters */
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px 32px;padding:16px;border-top:1px solid var(--cds-border-subtle)}
.params:empty{display:none}
.params.bare{padding:0;border-top:0}
.ctl{display:flex;flex-direction:column;gap:8px;min-width:0;padding:4px;margin:-4px;transition:background .11s}
.ctl.hl{background:var(--cds-layer-hover);box-shadow:inset 3px 0 0 var(--cds-interactive)}
.ctl.wide{grid-column:1/-1}
.lbl{font:400 12px/16px var(--sans);letter-spacing:.32px;color:var(--cds-text-secondary)}
.lbl code{font:600 12px/16px var(--mono);color:var(--cds-text-primary)}
/* slider */
.slider{display:flex;align-items:center;gap:12px}
.slider .mm{font:400 14px/18px var(--sans);color:var(--cds-text-primary);font-variant-numeric:tabular-nums;flex:none}
.slider input[type=range]{flex:1;min-width:0}
.slider output{flex:none;min-width:64px;height:40px;padding:0 12px;display:flex;align-items:center;background:var(--cds-field);border-bottom:1px solid var(--cds-border-strong);font:400 14px/18px var(--mono);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:24px;background:transparent;cursor:pointer;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--cds-border-inverse) var(--p),var(--cds-border-subtle-strong) var(--p))}
input[type=range]::-moz-range-track{height:2px;background:var(--cds-border-subtle-strong)}
input[type=range]::-moz-range-progress{height:2px;background:var(--cds-border-inverse)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cds-layer-selected-inverse);margin-top:-6px;transition:transform .11s}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--cds-layer-selected-inverse)}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{transform:scale(1.43)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{background:var(--cds-interactive);box-shadow:0 0 0 2px var(--cds-background), 0 0 0 4px var(--cds-focus)}
input[type=range]:disabled{opacity:.4;cursor:not-allowed}
/* content switcher */
.switcher{display:inline-flex;flex-wrap:wrap;max-width:100%}
.switcher button{height:40px;padding:0 16px;border:1px solid var(--cds-border-inverse);background:transparent;color:var(--cds-text-secondary);cursor:pointer;font:400 14px/18px var(--sans);white-space:nowrap;margin-left:-1px}
.switcher button:first-child{margin-left:0;border-radius:4px 0 0 4px}
.switcher button:last-child{border-radius:0 4px 4px 0}
.switcher button:hover{background:var(--cds-layer-hover);color:var(--cds-text-primary)}
.switcher button[aria-pressed="true"]{background:var(--cds-layer-selected-inverse);color:var(--cds-text-inverse)}
/* select */

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function prep(cv, hCss) {

  [0, 64, 128, 192, 255].forEach((v, i, a) => { const px = l + (v / 255) * (r - l); x.textAlign = i === 0 ? "left" : i === a.length - 1 ? "right" : "center"; x.fillText(v, px, y + 4); });
}
/* series: [{h, color, mode:'area'|'line'}]; each normalized to its own peak */
function drawHist(cv, series, opt = {}) {
  const [x, w, h] = prep(cv, 120), l = 2, r = w - 2, top = 6, bot = h - 20;
  x.strokeStyle = css("--line"); x.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { const yy = Math.round(top + (bot - top) * i / 4) + 0.5; x.beginPath(); x.moveTo(l, yy); x.lineTo(r, yy); x.stroke(); }
  for (const s of series) {
    let mx = 1; for (let i = 0; i < 256; i++) if (s.h[i] > mx) mx = s.h[i];
    const px = i => l + (i / 255) * (r - l), py = v => bot - (v / mx) * (bot - top);
    x.beginPath(); x.moveTo(px(0), bot);
    for (let i = 0; i < 256; i++) x.lineTo(px(i), py(s.h[i]));
    x.lineTo(px(255), bot); x.closePath();
    if (s.mode === "line") { x.strokeStyle = s.color; x.lineWidth = 1.25; x.stroke(); }
    else { x.globalAlpha = s.alpha ?? 1; x.fillStyle = s.color; x.fill(); x.globalAlpha = 1; }
  }
  if (opt.line != null) {
    const px = l + (opt.line / 255) * (r - l);
    x.strokeStyle = css("--fg"); x.setLineDash([4, 3]); x.lineWidth = 1.5; x.beginPath(); x.moveTo(px, top); x.lineTo(px, bot); x.stroke(); x.setLineDash([]);
    x.fillStyle = css("--fg"); x.font = "500 11px " + css("--mono"); x.textBaseline = "top"; x.textAlign = px > w - 60 ? "right" : "left"; x.fillText("T = " + opt.line, px + (px > w - 60 ? -5 : 5), top);
  }

}
function drawCurve(cv, lut) {
  const s = 120, dpr = window.devicePixelRatio || 1; cv.width = s * dpr; cv.height = s * dpr;
  const x = cv.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, s, s);
  const p = 6, q = s - 6, map = v => p + (v / 255) * (q - p);
  x.fillStyle = css("--frame"); x.fillRect(p, p, q - p, q - p);
  x.strokeStyle = css("--faint"); x.setLineDash([3, 3]); x.beginPath(); x.moveTo(p, q); x.lineTo(q, p); x.stroke(); x.setLineDash([]);
  x.strokeStyle = css("--fg"); x.lineWidth = 2; x.beginPath();
  for (let r = 0; r < 256; r++) { const X = map(r), Y = q - (map(lut[r]) - p); r ? x.lineTo(X, Y) : x.moveTo(X, Y); }
  x.stroke();
}
function drawSigma(cv, sig, k) {
  const [x, w, h] = prep(cv, 120), l = 2, r = w - 2, top = 6, bot = h - 20, n = sig.length;
  const lg = v => Math.log10(Math.max(v, 1e-3)), lo = lg(sig[n - 1] || 1e-3), hi = lg(sig[0]);
  const bw = (r - l) / n;
  for (let i = 0; i < n; i++) { const y = bot - ((lg(sig[i]) - lo) / (hi - lo || 1)) * (bot - top); x.fillStyle = i < k ? css("--fg") : css("--faint"); x.fillRect(l + i * bw, y, Math.max(bw - 0.5, 0.6), bot - y); }
  x.fillStyle = css("--muted"); x.font = "11px " + css("--mono"); x.textBaseline = "top";
  x.textAlign = "left"; x.fillText("1", l, bot + 4); x.textAlign = "center"; x.fillText(String(k), Math.min(Math.max(l + (k - 0.5) * bw, 20), r - 20), bot + 4); x.textAlign = "right"; x.fillText(String(n), r, bot + 4);
}
function renderKernels(el, list) {

  look: "With few colors the smooth sky breaks into bands. Drag colors down to 2 and back up to see how quickly the image recovers.",
  panes: ["Input", "Output"],
  controls: [{ type: "range", key: "k", name: "colors", label: "palette size", tip: "How many colors the palette may hold. Fewer colors means a smaller file and more visible banding.", min: 2, max: 64, step: 1, value: 8 }],
  code: s => "«image_q» = «image»«.quantize»(«colors=»‹k›)",
  run(s, v) { const q = quantize(SRC, s.k); v.show(0, SRC); v.show(1, q.img, `${q.colors} colors`); } },

/* ---------- manipulation ---------- */
{ id: "copy", group: "manipulation", title: "Copy or alias", pixelwise: true,
  text: "Assigning an array to a new name does not copy it. Both names point to the same pixels in memory, so changing one changes the other. This is called aliasing. Calling copy() makes an independent array that keeps the original values.",
  look: "The image panel now shows A and B. Run the extra line below to set A to zero, then check whether B went black too. Switch B to A.copy() in step 2 and run it again.",
  panes: ["A", "B"],
  controls: [
    { type: "chips", key: "mode", name: "B", label: "how B is made", tip: "B = A gives a second name for the same array. B = A.copy() makes a separate array.", value: "alias", options: [["alias", "B = A"], ["copy", "B = A.copy()"]] },
    { type: "buttons", where: "output", label: "Change A", items: [["Run A[:, :, :] = 0", s => s.zeroed = true], ["Undo that line", s => s.zeroed = false]] },
  ],
  code: s => `«A» = «np.array»(«image»)\n«B» = ‹mode›\n${s.zeroed ? "«A[:, :, :] = 0|Sets every pixel in every channel of A to 0 (black).»\n" : ""}«id»(«A») == «id»(«B»)   # ${s.mode === "alias" ? "True" : "False"}`,
  codeFmt: { mode: v => v === "alias" ? "A" : "A.copy()" },
  run(s, v) { const black = mk(N, N, 3); v.show(0, s.zeroed ? black : SRC); v.show(1, s.zeroed && s.mode === "alias" ? black : SRC); } },

{ id: "flip", group: "manipulation", title: "Flip and rotate by 90°",
  text: "Flipping and right-angle rotation only move pixels to new positions, so no values change and nothing is lost. Pillow does all of these with transpose(); OpenCV uses flip() with an axis code and rotate().",
  look: "Watch where the car and the striped tower end up. ROTATE_90 turns counter-clockwise; TRANSPOSE mirrors across the diagonal.",
  panes: ["Input", "Output"],
  controls: [{ type: "chips", key: "t", name: "method", label: "which transpose", tip: "", wide: true, value: "FLIP_LEFT_RIGHT", options: Object.keys(FLIPS).map(k => [k, k]) }],
  code: s => `«new_image» = «image»«.transpose»(‹t›)   # Pillow\n«new_image» = ${FLIPS[s.t].cv}   # OpenCV`,
  codeFmt: { t: v => "Image." + v },
  tipFor: { t: s => `Image.${s.t} ${FLIP_TIPS[s.t]}` },
  run(s, v) { const o = mk(N, N, 3), f = FLIPS[s.t].f; for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const [sx, sy] = f(x, y), i = (y * N + x) * 3, j = (sy * N + sx) * 3; o.d[i] = SRC.d[j]; o.d[i + 1] = SRC.d[j + 1]; o.d[i + 2] = SRC.d[j + 2]; } v.show(0, SRC); v.show(1, o); } },

{ id: "crop", group: "manipulation", title: "Cropping", region: true,
  text: "Cropping keeps a rectangle and throws away the rest. On an array it is plain slicing, rows first and then columns. Pillow's crop() takes the same box, but in the order (left, upper, right, lower).",
  look: "The output is enlarged to fit its frame. Drag across the input image to draw a new box, or fine-tune it with the four values.",
  panes: ["Input · drag to select", "Output"],
  controls: BOX,
  code: s => "«crop» = «image»[‹u›:‹lo›, ‹l›:‹r›]   # array slicing: rows, then columns\n«crop» = «image»«.crop»((‹l›, ‹u›, ‹r›, ‹lo›))   # Pillow",
  run(s, v) { fixBox(s); const o = mk(s.r - s.l, s.lo - s.u, 3); for (let y = s.u; y < s.lo; y++) for (let x = s.l; x < s.r; x++) { const i = ((y - s.u) * o.w + (x - s.l)) * 3, j = (y * N + x) * 3; o.d[i] = SRC.d[j]; o.d[i + 1] = SRC.d[j + 1]; o.d[i + 2] = SRC.d[j + 2]; } v.show(0, SRC); v.box(s); v.show(1, o); } },

{ id: "pixels-edit", group: "manipulation", title: "Changing pixels", region: true, pixelwise: true,
  text: "Indexing can also write pixels. You can zero out channels inside a box, draw a filled shape with ImageDraw, or paste one image on top of another. These change the image in place, so the code works on a copy.",
  look: "Drag across the input to move the box. Hover inside the box to see the changed values.",
  panes: ["Input · drag to select", "Output"],
  controls: [{ type: "chips", key: "m", name: "operation", label: "what to do inside the box", tip: "Which edit to apply inside the box.", wide: true, value: "zero", options: [["zero", "Zero green and blue"], ["rect", "Draw a red rectangle"], ["paste", "Paste a mirrored crop"]] }, ...BOX],
  code: s => ({
    zero: "«array_sq» = «np.copy»(«array»)\n«array_sq»[‹u›:‹lo›, ‹l›:‹r›, «1:3|Channels 1 and 2. In a Pillow (R, G, B) array that is green and blue, so only red is left.»] = «0|Writes 0 into those channels for every pixel in the box.»",
    rect: "«image_draw» = «image»«.copy»()\n«ImageDraw.Draw»(«im=»«image_draw»)«.rectangle»(«xy=»[‹l›, ‹u›, ‹r›, ‹lo›], «fill=\"red\"»)",
    paste: "«crop» = «image»«.crop»((‹l›, ‹u›, ‹r›, ‹lo›))«.transpose»(«Image.FLIP_LEFT_RIGHT»)\n«new_image» = «image»«.copy»()\n«new_image»«.paste»(«crop», «box=»(‹l›, ‹u›))",
  })[s.m],
  run(s, v) {
    fixBox(s); const o = clone(SRC);
    for (let y = s.u; y < s.lo; y++) for (let x = s.l; x < s.r; x++) {
      const i = (y * N + x) * 3;
      if (s.m === "zero") { o.d[i + 1] = 0; o.d[i + 2] = 0; }
      else if (s.m === "rect") { o.d[i] = 255; o.d[i + 1] = 0; o.d[i + 2] = 0; }
      else { const j = (y * N + (s.r - 1 - (x - s.l))) * 3; o.d[i] = SRC.d[j]; o.d[i + 1] = SRC.d[j + 1]; o.d[i + 2] = SRC.d[j + 2]; }
    }
    v.show(0, SRC); v.box(s); v.show(1, o);
  } },

/* ---------- intensity ---------- */
{ id: "histogram", group: "intensity", title: "Histogram", single: true,
  text: "A histogram counts how many pixels have each intensity from 0 to 255. Its peaks show which tones dominate: dark images pile up on the left, bright ones on the right. A color image has one histogram per channel.",
  look: "Hover the chart to read the count for any intensity. The tall hump on the left is the dark buildings and road; the spread to the right is the sky.",
  panes: ["Input"], extras: [["hist", "Pixel count by intensity", true]],
  controls: [{ type: "chips", key: "m", name: "channels", label: "which histogram", tip: "One gray histogram, or one per color channel.", value: "gray", options: [["gray", "Grayscale"], ["rgb", "Red, green, blue"]] }],
  code: s => s.m === "gray"
    ? "«hist» = «cv2.calcHist»([«image_gray»], [«0|The channel to count. A grayscale image only has channel 0.»], «None», [«256»], [«0, 256»])"
    : "«for» «i|The channel index: 0 blue, 1 green, 2 red.», «col|The channel's name, used as the line color.» «in|Loop keyword.» «enumerate»((«'blue'|Channel 0 in OpenCV's B, G, R order.», «'green'|Channel 1.», «'red'|Channel 2.»)):\n    «hist» = «cv2.calcHist»([«image»], [«i|Which channel to count this time round the loop.»], «None», [«256»], [«0, 256»])",
  run(s, v) {
    if (s.m === "gray") { v.show(0, GRAY); drawHist(v.ex.hist, [{ h: hist(GRAY), color: css("--fg") }]); }
    else { v.show(0, SRC); drawHist(v.ex.hist, [["--ch-r", 0], ["--ch-g", 1], ["--ch-b", 2]].map(([c, ch]) => ({ h: hist(SRC, ch), color: css(c), mode: "line" }))); }
  } },

{ id: "negative", group: "intensity", title: "Image negative", pixelwise: true,
  text: "The negative reverses every intensity with s = 255 − r. Dark becomes bright and bright becomes dark, while mid-grays barely move. In medical images such as mammograms, the reversed version can make small bright details easier to examine.",
  look: "The curve shows the mapping: input r along the bottom, output s up the side. The histogram is the same shape, flipped left to right.",
  panes: ["Input · grayscale", "Output"], extras: [["curve", "s = T(r)"], ["hist", "Histogram · before (gray) and after (black)", true]],
  controls: [],
  code: () => "«img_neg» = «255|The highest value an 8-bit pixel can hold: L − 1, with L = 256 levels.» «-|Subtracts every pixel from 255, so 0 becomes 255 and 255 becomes 0.» «image»",
  run(s, v) { const lut = makeLut(r => 255 - r), o = applyLut(GRAY, lut); v.show(0, GRAY); v.show(1, o); drawCurve(v.ex.curve, lut); drawHist(v.ex.hist, [{ h: hist(GRAY), color: css("--faint") }, { h: hist(o), color: css("--fg"), mode: "line" }]); } },

{ id: "brightness", group: "intensity", title: "Brightness and contrast", pixelwise: true,
  text: "The transform g = α·f + β changes contrast and brightness: α scales the intensities apart, β shifts them all up or down. convertScaleAbs takes the absolute value before clipping to 0–255, so results that go negative come back as positive values instead of black.",
  look: "The curve is the mapping from input to output. A steeper line means more contrast; a higher line means brighter. Try the three examples from the lab.",
  panes: ["Input · grayscale", "Output"], extras: [["curve", "s = T(r)"], ["hist", "Histogram · before (gray) and after (black)", true]],
  controls: [
    { type: "presets", label: "Examples from the lab", wide: true, items: [["Brighter: α 1, β 100", { a: 1, b: 100 }], ["More contrast: α 2, β 0", { a: 2, b: 0 }], ["Both: α 3, β −200", { a: 3, b: -200 }]] },
    { type: "range", key: "a", name: "alpha", label: "contrast", tip: "alpha multiplies every pixel. Above 1 spreads the tones apart (more contrast); below 1 squeezes them together.", min: 0, max: 3, step: 0.1, value: 1, fmt: v => v.toFixed(1) },
    { type: "range", key: "b", name: "beta", label: "brightness", tip: "beta is added to every pixel after scaling. Positive values brighten, negative values darken.", min: -200, max: 200, step: 5, value: 100 },
  ],
  code: s => "«new_image» = «cv2.convertScaleAbs»(«image», «alpha=|Contrast factor.»‹a›, «beta=|Brightness offset.»‹b›)",
  run(s, v) { const lut = makeLut(r => Math.abs(s.a * r + s.b)), o = applyLut(GRAY, lut); v.show(0, GRAY); v.show(1, o); drawCurve(v.ex.curve, lut); drawHist(v.ex.hist, [{ h: hist(GRAY), color: css("--faint") }, { h: hist(o), color: css("--fg"), mode: "line" }]); } },

{ id: "equalize", group: "intensity", title: "Histogram equalization", pixelwise: true,
  text: "Histogram equalization raises contrast automatically by spreading the intensities across the full 0–255 range. Each level is mapped through the cumulative histogram, which pulls crowded tones apart.",
  look: "The input is a washed-out copy of the image. Compare the two histograms: the gray one is squeezed into the middle, the black one is spread across the whole range.",
  panes: ["Input · grayscale", "Output"], extras: [["curve", "s = T(r)"], ["hist", "Histogram · before (gray) and after (black)", true]],
  controls: [{ type: "chips", key: "src", name: "image", label: "which input", tip: "The image passed in. The washed-out copy only uses values from about 92 to 174, which makes the effect easy to see.", value: "low", options: [["low", "Washed-out copy"], ["orig", "Original grayscale"]] }],
  code: () => "«new_image» = «cv2.equalizeHist»(‹src›)",
  codeFmt: { src: v => v === "low" ? "low_contrast" : "image_gray" },
  run(s, v) {
    const inp = s.src === "low" ? applyLut(GRAY, makeLut(r => 92 + r * 0.32)) : GRAY, h = hist(inp);
    let cdf = 0, min = 0; const c = new Float64Array(256); for (let i = 0; i < 256; i++) { cdf += h[i]; c[i] = cdf; if (!min && cdf) min = cdf; }
    const lut = makeLut(r => Math.round((c[r] - min) * 255 / (N * N - min || 1))), o = applyLut(inp, lut);
    v.show(0, inp); v.show(1, o); drawCurve(v.ex.curve, lut); drawHist(v.ex.hist, [{ h, color: css("--faint") }, { h: hist(o), color: css("--fg"), mode: "line" }]);
  } },

{ id: "threshold", group: "intensity", title: "Thresholding", pixelwise: true,
  text: "Thresholding splits a grayscale image into two levels. Pixels above the threshold get the maximum value and the rest become 0, which is the simplest way to separate an object from its background. TRUNC caps bright pixels at the threshold instead, and Otsu's method picks the threshold for you from the histogram.",
  look: "The dashed line on the histogram is the threshold. Everything to its right turns white. Pick OTSU to see where the automatic method puts it.",
  panes: ["Input · grayscale", "Output"], extras: [["hist", "Input histogram and threshold", true]],
  controls: [
    { type: "chips", key: "t", name: "type", label: "threshold type", tip: "", value: "BINARY", options: [["BINARY", "BINARY"], ["BINARY_INV", "BINARY_INV"], ["TRUNC", "TRUNC"], ["OTSU", "OTSU"]] },
    { type: "range", key: "T", name: "thresh", label: "threshold", tip: "thresh: pixels greater than this value pass. Ignored when OTSU is used.", min: 0, max: 255, step: 1, value: 90, disabled: s => s.t === "OTSU" },
  ],
  code: s => s.t === "OTSU"
    ? `«ret», «otsu» = «cv2.threshold»(«image», «0|Ignored: Otsu's method computes its own threshold.», «255|maxval: the value given to pixels above the threshold.», ‹t›)   # ret = ${s._otsu ?? ""}`
    : "«ret», «new_image» = «cv2.threshold»(«image», ‹T›, «255|maxval: the value given to pixels above the threshold.», ‹t›)",
  codeFmt: { t: v => "cv2.THRESH_" + v },
  tipFor: { t: s => ({ BINARY: "THRESH_BINARY: above the threshold becomes 255, everything else 0.", BINARY_INV: "THRESH_BINARY_INV: the reverse, above becomes 0 and everything else 255.", TRUNC: "THRESH_TRUNC: values above the threshold are cut down to it; darker pixels are unchanged.", OTSU: "THRESH_OTSU: picks the threshold that best separates the histogram into two groups, then applies BINARY." })[s.t] },
  run(s, v) {
    const h = hist(GRAY), T = s.t === "OTSU" ? (s._otsu = otsu(h)) : s.T;
    const lut = makeLut(r => s.t === "TRUNC" ? Math.min(r, T) : s.t === "BINARY_INV" ? (r > T ? 0 : 255) : (r > T ? 255 : 0));
    v.show(0, GRAY); v.show(1, applyLut(GRAY, lut)); drawHist(v.ex.hist, [{ h, color: css("--fg") }], { line: T });
  } },

/* ---------- geometry ---------- */
{ id: "scaling", group: "geometry", title: "Scaling", nativeOut: true,
  text: "Resizing changes how many pixels the image has. Shrinking throws detail away, and enlarging has to invent new pixels by interpolation. Nearest neighbor copies the closest pixel; linear and cubic blend the neighbors for smoother results.",
  look: "The output is drawn at the same pixel size as the input, so anything wider or taller than 256 is cut off at the frame. Set fx to 4 and compare INTER_NEAREST with INTER_CUBIC.",
  panes: ["Input", "Output · same pixel size"],
  controls: [
    { type: "range", key: "fx", name: "fx", label: "width factor", tip: "fx multiplies the width. 2 doubles it, 0.5 halves it.", min: 0.25, max: 4, step: 0.25, value: 2, fmt: v => v.toFixed(2) },
    { type: "range", key: "fy", name: "fy", label: "height factor", tip: "fy multiplies the height.", min: 0.25, max: 4, step: 0.25, value: 1, fmt: v => v.toFixed(2) },
    { type: "chips", key: "i", name: "interpolation", label: "how new pixels are made", tip: "", wide: true, value: "CUBIC", options: [["NEAREST", "INTER_NEAREST"], ["LINEAR", "INTER_LINEAR"], ["CUBIC", "INTER_CUBIC"]] },
  ],
  code: s => "«new_image» = «cv2.resize»(«image», «None |dsize. None means the output size is worked out from fx and fy instead.», «fx=»‹fx›, «fy=»‹fy›, «interpolation=»‹i›)",
  codeFmt: { i: v => "cv2.INTER_" + v, fx: num, fy: num },
  tipFor: { i: s => ({ NEAREST: "INTER_NEAREST copies the single closest source pixel. Fast, but blocky when enlarging.", LINEAR: "INTER_LINEAR blends the 4 nearest pixels by distance.", CUBIC: "INTER_CUBIC fits a smooth curve through the 16 nearest pixels. Slower, smoothest when enlarging." })[s.i] },
  run(s, v) { const nw = Math.max(1, Math.round(N * s.fx)), nh = Math.max(1, Math.round(N * s.fy)); v.show(0, SRC); v.show(1, resize(SRC, nw, nh, s.i)); } },

{ id: "translation", group: "geometry", title: "Translation",
  text: "Translation shifts the image by tx pixels across and ty pixels down. OpenCV writes the shift as a 2 × 3 matrix M and applies it with warpAffine. The area the image leaves behind fills with black, and anything pushed past the edge is cut off.",
  look: "The matrix below shows M with your values in its last column. Negative values move the image left or up.",
  panes: ["Input", "Output"], extras: [["matrix", "M"]],
  controls: [
    { type: "range", key: "tx", name: "tx", label: "shift right", tip: "tx: horizontal shift in pixels. Positive moves the image right.", min: -128, max: 128, step: 1, value: 60 },
    { type: "range", key: "ty", name: "ty", label: "shift down", tip: "ty: vertical shift in pixels. Positive moves the image down.", min: -128, max: 128, step: 1, value: 30 },
  ],
  code: s => "«M» = «np.float32»([[«1|Row 1 of the identity part: x is kept as it is.», «0|No y in the new x: the image is not sheared or rotated.», ‹tx›], [«0|No x in the new y.», «1|Row 2 of the identity part: y is kept as it is.», ‹ty›]])\n«new_image» = «cv2.warpAffine»(«image», «M», «(cols, rows)»)",
  run(s, v) { const M = [1, 0, s.tx, 0, 1, s.ty]; v.show(0, SRC); v.show(1, warp(SRC, M, N, N)); renderMatrix(v.ex.matrix, M, 0); } },

{ id: "rotation", group: "geometry", title: "Rotation",
  text: "getRotationMatrix2D builds the matrix for a rotation about a center point, with an optional scale. Positive angles turn the image counter-clockwise. warpAffine then looks up where each output pixel came from and blends the nearest input pixels.",
  look: "The corners clip and the uncovered areas turn black. Lower the scale to fit the whole rotated image inside the frame.",
  panes: ["Input", "Output"], extras: [["matrix", "M"]],
  controls: [
    { type: "range", key: "a", name: "angle", label: "degrees", tip: "angle: rotation in degrees. Positive turns counter-clockwise.", min: -180, max: 180, step: 1, value: 45 },
    { type: "range", key: "sc", name: "scale", label: "zoom", tip: "scale: zoom applied with the rotation. 1 keeps the size; 0.7 makes room for the corners.", min: 0.25, max: 2, step: 0.05, value: 1, fmt: v => v.toFixed(2) },
  ],
  code: s => "«M» = «cv2.getRotationMatrix2D»(«center=»(«cols // 2 - 1|x of the center: the middle column.», «rows // 2 - 1|y of the center: the middle row.»), «angle=»‹a›, «scale=»‹sc›)\n«new_image» = «cv2.warpAffine»(«image», «M», «(cols, rows)»)",
  codeFmt: { sc: num },
  run(s, v) {
    const t = s.a * Math.PI / 180, al = s.sc * Math.cos(t), be = s.sc * Math.sin(t), cx = N / 2 - 1, cy = N / 2 - 1;
    const M = [al, be, (1 - al) * cx - be * cy, -be, al, be * cx + (1 - al) * cy];
    v.show(0, SRC); v.show(1, warp(SRC, M, N, N)); renderMatrix(v.ex.matrix, M, 3);
  } },

{ id: "arrays", group: "geometry", title: "Array arithmetic", pixelwise: true,
  text: "An image is an array, so arithmetic works on every pixel at once. With NumPy's uint8 type, a value past 255 wraps around to 0 instead of stopping at 255, and a value below 0 wraps to 255. Clipping to 0–255 keeps bright areas bright.",
  look: "With wrap-around, the brightest parts (windows, sun, lane markings) turn dark. Switch to clipping and hover a bright pixel to compare.",
  panes: ["Input", "Output"],
  controls: [
    { type: "chips", key: "op", name: "operation", label: "what to do", tip: "", value: "add", options: [["add", "Add a constant"], ["mul", "Multiply"], ["noise", "Add noise"]] },
    { type: "chips", key: "ov", name: "overflow", label: "past 0 or 255", tip: "", value: "wrap", options: [["wrap", "uint8 wraps around"], ["clip", "Clip to 0–255"]] },
    { type: "range", key: "add", name: "value", label: "constant", tip: "The number added to every pixel in every channel.", min: -128, max: 128, step: 1, value: 20, show: s => s.op === "add" },
    { type: "range", key: "mul", name: "factor", label: "multiplier", tip: "Every pixel is multiplied by this number.", min: 0, max: 10, step: 0.5, value: 1.5, fmt: v => v.toFixed(1), show: s => s.op === "mul" },
    { type: "range", key: "sig", name: "scale", label: "noise σ", tip: "The standard deviation of the noise: how far a typical random value is from 0.", min: 0, max: 60, step: 1, value: 20, show: s => s.op === "noise" },
  ],
  code: s => {
    const w = s.ov === "wrap";
    if (s.op === "add") return w ? "«new_image» = «image» «+|Adds the value to every element. With uint8, results past 255 wrap around to 0.» ‹add›" : "«new_image» = «np.clip»(«image»«.astype(int)» + ‹add›, «0|Lower limit: anything below 0 becomes 0.», «255|Upper limit: anything above 255 becomes 255.»)«.astype(np.uint8)»";
    if (s.op === "mul") return w ? "«new_image» = (‹mul› «*|Multiplies every element.» «image»)«.astype(np.uint8)»" : "«new_image» = «np.clip»(‹mul› * «image», «0|Lower limit.», «255|Upper limit: anything above 255 becomes 255.»)«.astype(np.uint8)»";
    return "«noise» = «np.random.normal»(«0|The mean of the noise: on average it adds nothing.», ‹sig›, («rows», «cols», «3|One noise value per channel.»))" + (w ? "«.astype(np.uint8)»\n«new_image» = «image» + «noise»" : "\n«new_image» = «np.clip»(«image» + «noise», «0|Lower limit: anything below 0 becomes 0.», «255|Upper limit: anything above 255 becomes 255.»)«.astype(np.uint8)»");
  },
  codeFmt: { mul: num },
  tipFor: { op: () => "Which arithmetic to apply to every pixel.", ov: s => s.ov === "wrap" ? "uint8 arithmetic is modulo 256: 250 + 20 gives 14, and 10 − 20 gives 246." : "np.clip limits results to 0–255: 250 + 20 gives 255, and 10 − 20 gives 0." },
  run(s, v) {
    const o = mk(N, N, 3), r = rng(5), w = s.ov === "wrap";
    for (let i = 0; i < SRC.d.length; i++) {
      const x = SRC.d[i]; let y;
      if (s.op === "add") y = x + s.add; else if (s.op === "mul") y = Math.trunc(s.mul * x); else { const n = gaussR(r) * s.sig; y = w ? x + Math.trunc(n) : x + n; }
      o.d[i] = w ? (((Math.round(y) % 256) + 256) % 256) : y;
    }
    v.show(0, SRC); v.show(1, o);
  } },

{ id: "svd", group: "geometry", title: "Matrix operations: SVD", pixelwise: true,

/* ---------- filtering ---------- */
{ id: "mean", group: "filtering", title: "Mean filter", pixelwise: true,
  text: "A mean filter replaces each pixel with the average of its neighborhood, defined by a kernel of equal weights. Averaging cancels random noise, but it also blurs edges, and a larger kernel does more of both.",
  look: "Raise the kernel size and watch the noise fade while the window edges soften. The grid shows the kernel: every cell has the same weight.",
  panes: ["Input + noise", "Filtered"], extras: [["kernel", ""]],
  controls: [
    { type: "range", key: "sig", name: "noise σ", label: "noise strength", tip: "The standard deviation of the noise added before filtering.", min: 0, max: 40, step: 1, value: 15 },
    { type: "range", key: "k", name: "k", label: "kernel size", tip: "The kernel is k × k pixels. Bigger averages over more neighbors.", min: 3, max: 11, step: 2, value: 5, fmt: v => `${v} × ${v}` },
  ],
  code: s => `«noise» = «np.random.normal»(«0|The mean of the noise.», ‹sig›, («rows», «cols», «3|One noise value per channel.»))\n«noisy_image» = «image» + «noise»\n«kernel» = «np.ones»((‹k›, ‹k›)) / «${s.k * s.k}|Dividing by the number of weights (k × k) makes them add up to 1, so the overall brightness stays the same.»\n«image_filtered» = «cv2.filter2D»(«src=»«noisy_image», «ddepth=-1», «kernel=»«kernel»)`,
  run(s, v) { const noisy = addNoise(SRC, s.sig, 3), k = new Array(s.k * s.k).fill(1 / (s.k * s.k)); v.show(0, noisy); v.show(1, fromF(noisy, conv(noisy, k, s.k, s.k))); renderKernels(v.ex.kernel, [{ k, kw: s.k, kh: s.k, dec: 3, label: `Kernel · each weight is 1/${s.k * s.k}` }]); } },

{ id: "gaussian", group: "filtering", title: "Gaussian blur", pixelwise: true,
  text: "A Gaussian kernel gives near neighbors more weight than distant ones, so it removes noise while blurring edges less than a plain average. Sigma sets how fast the weights fall off from the center, and the kernel size limits how far they reach.",
  look: "The kernel grid shows the weights: darker cells count more. A small sigma in a big kernel wastes the outer cells; a big sigma in a small kernel gets cut off.",
  panes: ["Input + noise", "Filtered"], extras: [["kernel", ""]],
  controls: [
    { type: "range", key: "k", name: "ksize", label: "kernel size", tip: "ksize: the kernel's width and height. It must be odd.", min: 3, max: 15, step: 2, value: 11, fmt: v => `${v} × ${v}` },
    { type: "range", key: "sg", name: "sigma", label: "spread", tip: "sigmaX and sigmaY: the standard deviation of the Gaussian. Bigger spreads the weight further and blurs more.", min: 0.5, max: 10, step: 0.5, value: 4, fmt: v => v.toFixed(1) },
  ],
  code: s => "«image_filtered» = «cv2.GaussianBlur»(«noisy_image», (‹k›, ‹k›), «sigmaX=»‹sg›, «sigmaY=»‹sg›)",
  codeFmt: { sg: num },
  run(s, v) {
    const noisy = addNoise(SRC, 15, 3), g = gaussKernel(s.k, s.sg), k2 = []; for (let j = 0; j < s.k; j++) for (let i = 0; i < s.k; i++) k2.push(g[j] * g[i]);
    v.show(0, noisy); v.show(1, fromF(noisy, convSep(noisy, g))); renderKernels(v.ex.kernel, [{ k: k2, kw: s.k, kh: s.k, dec: 3, label: "Kernel weights (darker counts more)" }]);
  } },

{ id: "sharpen", group: "filtering", title: "Sharpening", pixelwise: true,
  text: "Sharpening adds the difference between a pixel and its neighbors back into the image, which exaggerates edges and fine texture. The kernel's weights add up to 1, so flat areas keep their brightness.",
  look: "Hover a window edge to see the values pushed apart. Pillow's SHARPEN uses the same idea with a gentler center weight.",
  panes: ["Input", "Sharpened"], extras: [["kernel", ""]],
  controls: [{ type: "chips", key: "k", name: "kernel", label: "which kernel", tip: "", value: "custom", options: [["custom", "Lab kernel (center 9)"], ["pil", "ImageFilter.SHARPEN"]] }],
  code: s => s.k === "custom"
    ? "«kernel» = «np.array |Writes the kernel out by hand.»([[«-1|Each neighbor is subtracted once.», -1, -1],\n                   [-1,  «9|The center pixel counts 9 times. 9 − 8 neighbors = 1, so flat areas are unchanged.», -1],\n                   [-1, -1, -1]])\n«sharpened» = «cv2.filter2D»(«image», «-1», «kernel»)"
    : "«sharpened» = «image»«.filter»(«ImageFilter.SHARPEN»)",
  tipFor: { k: s => s.k === "custom" ? "The 3 × 3 kernel used in the lab: center 9, all eight neighbors −1." : "Pillow's built-in SHARPEN: center 32, neighbors −2, divided by 16. A milder effect." },
  run(s, v) { const k = SHARP[s.k]; v.show(0, SRC); v.show(1, fromF(SRC, conv(SRC, k, 3, 3))); renderKernels(v.ex.kernel, [{ k, kw: 3, kh: 3, dec: 3, label: "Kernel" }]); } },

{ id: "sobel", group: "filtering", title: "Edges with Sobel", pixelwise: true,
  text: "Edges are where intensity changes quickly. The Sobel kernels estimate that change horizontally (dx) and vertically (dy), and combining the two shows edges in every direction.",
  look: "In the dx and dy views, mid-gray means no change, while white and black mean change in opposite directions. dx picks up the tower's vertical stripes; dy picks up the rooftops and the road.",
  panes: ["Input · grayscale", "Output"], extras: [["kernel", ""]],
  controls: [{ type: "chips", key: "d", name: "direction", label: "which gradient", tip: "", value: "mag", options: [["x", "dx = 1"], ["y", "dy = 1"], ["mag", "Combined"]] }],
  code: s => s.d === "x"
    ? "«grad_x» = «cv2.Sobel»(«src=»«img_gray», «ddepth=cv2.CV_16S», «dx=1|First derivative across the width: change from left to right.», «dy=0|No derivative down the height.», «ksize=3»)"
    : s.d === "y"
    ? "«grad_y» = «cv2.Sobel»(«src=»«img_gray», «ddepth=cv2.CV_16S», «dx=0|No derivative across the width.», «dy=1|First derivative down the height: change from top to bottom.», «ksize=3»)"
    : "«abs_grad_x» = «cv2.convertScaleAbs»(«grad_x»)\n«abs_grad_y» = «cv2.convertScaleAbs»(«grad_y»)\n«grad» = «cv2.addWeighted»(«abs_grad_x», «0.5», «abs_grad_y», «0.5», «0|gamma: a constant added at the end. 0 adds nothing.»)",
  tipFor: { d: s => ({ x: "dx = 1: the horizontal gradient, which highlights vertical edges.", y: "dy = 1: the vertical gradient, which highlights horizontal edges.", mag: "Both gradients as absolute values, averaged together." })[s.d] },
  run(s, v) {
    const gx = conv(GRAY, SOBX, 3, 3), gy = conv(GRAY, SOBY, 3, 3), o = mk(N, N, 1);
    if (s.d === "mag") for (let i = 0; i < o.d.length; i++) o.d[i] = Math.round(0.5 * Math.min(255, Math.abs(gx[i])) + 0.5 * Math.min(255, Math.abs(gy[i])));
    else { const g = s.d === "x" ? gx : gy; let m = 1; for (const val of g) m = Math.max(m, Math.abs(val)); for (let i = 0; i < o.d.length; i++) o.d[i] = 127.5 + 127.5 * g[i] / m; }
    v.show(0, GRAY); v.show(1, o);
    renderKernels(v.ex.kernel, s.d === "x" ? [{ k: SOBX, kw: 3, kh: 3, label: "dx kernel" }] : s.d === "y" ? [{ k: SOBY, kw: 3, kh: 3, label: "dy kernel" }] : [{ k: SOBX, kw: 3, kh: 3, label: "dx kernel" }, { k: SOBY, kw: 3, kh: 3, label: "dy kernel" }]);
  } },

{ id: "median", group: "filtering", title: "Median filter", pixelwise: true,
  text: "A median filter replaces each pixel with the median of its neighborhood instead of the mean. Isolated black and white specks (salt-and-pepper noise) are outliers, so the median ignores them and edges stay sharp.",

    { type: "chips", key: "k", name: "ksize", label: "kernel size", tip: "ksize: the neighborhood is ksize × ksize. It must be odd.", value: 5, options: [[3, "3"], [5, "5"], [7, "7"]] },
    { type: "chips", key: "f", name: "filter", label: "median or mean", tip: "", value: "median", options: [["median", "Median"], ["mean", "Mean, same size"]] },
  ],
  code: s => s.f === "median" ? "«filtered_image» = «cv2.medianBlur»(«image», ‹k›)" : "«filtered_image» = «cv2.blur»(«image», (‹k›, ‹k›))",
  tipFor: { f: s => s.f === "median" ? "medianBlur: the middle value of the neighborhood. Extreme specks never end up in the middle." : "blur: the plain average. Every speck pulls the average up or down." },
  run(s, v) { const noisy = saltPepper(GRAY, s.amt / 100, 9); v.show(0, noisy); v.show(1, s.f === "median" ? medianFilter(noisy, s.k) : fromF(noisy, conv(noisy, new Array(s.k * s.k).fill(1 / (s.k * s.k)), s.k, s.k))); } },
];

Object.assign(TIPS, {

const RESAMPLE = { NEAREST: "NEAREST", LINEAR: "BILINEAR", CUBIC: "BICUBIC" };
const PIL_EE = [-1, -1, -1, -1, 10, -1, -1, -1, -1].map(v => v / 2), PIL_FE = [-1, -1, -1, -1, 8, -1, -1, -1, -1];
const noiseLines = "«noise» = «np.random.normal»(«0|The mean of the noise.», ‹sig›, («rows», «cols», «3|One noise value per channel.»))\n«noisy_image» = «image» + «noise»\n";

const OVERRIDES = {
  grayscale: { libs: true,

      ? (isPil(s) ? "«image_gray» = «np.array»(«image»)«.mean»(«axis=2»)«.astype(np.uint8)»   # equal weights, for comparison" : "«image_gray» = «image»«.mean»(«axis=2»)«.astype(np.uint8)»   # equal weights, for comparison")
      : (isPil(s) ? "«image_gray» = «ImageOps.grayscale»(«image»)" : "«image_gray» = «cv2.cvtColor»(«image», «cv2.COLOR_BGR2GRAY»)") },

  channels: { libs: true,
    code: s => {
      const pil = isPil(s);
      if (s.ch === "bgr") return pil
        ? "«image» = «Image.open»(«\"image.png\"|The file to load.»)\n«plt.imshow»(«image»)   # Pillow keeps R, G, B order, so the colors are correct"
        : "«image» = «cv2.imread»(«\"image.png\"|The file to load.»)\n«plt.imshow»(«image»)   # still B, G, R, so red and blue appear swapped";
      const order = pil ? ["red", "green", "blue"] : ["blue", "green", "red"], keep = order.indexOf(s.ch);
      const name = `image_${s.ch}`, nt = `A copy that will keep only the ${s.ch} channel.`;
      const lines = [pil ? `«${name}|${nt}» = «np.array»(«image»)` : `«${name}|${nt}» = «image»«.copy»()`];
      [0, 1, 2].filter(c => c !== keep).forEach(c => lines.push(`«${name}|${nt}»«[:, :, ${c}]|Every row, every column, channel ${c}. In ${pil ? "Pillow's R, G, B" : "OpenCV's B, G, R"} order that is ${order[c]}.» = «0|Setting the whole channel to 0 removes that color.»   # ${order[c]}`));
      return lines.join("\n");
    },
    run(s, v) {

      if (!(s.ch === "bgr" && isPil(s))) for (let p = 0; p < N * N; p++) { const j = p * 3; if (s.ch === "bgr") { o.d[j] = SRC.d[j + 2]; o.d[j + 2] = SRC.d[j]; } else { const keep = { red: 0, green: 1, blue: 2 }[s.ch]; for (let c = 0; c < 3; c++) if (c !== keep) o.d[j + c] = 0; } }

  flip: { libs: true,

    codeFmt: { t: (v, s) => isPil(s) ? "Image." + v : v } },

  crop: { libs: true,

        : "«image_draw» = «image»«.copy»()\n«cv2.rectangle»(«image_draw», «pt1=»(‹l›, ‹u›), «pt2=»(‹r›, ‹lo›), «color=(0, 0, 255)|Red, written in B, G, R order.», «thickness=-1|A negative thickness fills the rectangle instead of drawing only its outline.»)";

/* ---------- image panel ---------- */

/* ---------- wizard ---------- */

function setLib(id) { LIB = id; store.set("pixelops-lib", id); if (cur) { cur.hlKey = null; hideTip(); update(cur, true); } }
const isDefault = op => Object.keys(op.defaults).every(k => op.s[k] === op.defaults[k]) && !op.s.zeroed;

function open(op) {

  const steps = el("div", "steps"); wz.appendChild(steps);

  b1.appendChild(el("p", "", esc(op.text)));
  const next1 = el("button", "btn btn-primary", `Show the code ${ICON.arrowD}`); next1.type = "button"; b1.appendChild(next1);

  const [s2, b2, i2] = stepEl(2, "The code", total);
  b2.appendChild(el("p", "helper", (op.libs ? "Pillow and OpenCV write this differently, so switch tabs to compare. " : "") + "Hover or tap any underlined part of the code to see what it does. The blue values are editable: click one and type a new value, or use the controls below."));
  const card = el("div", "snippet"), tabs = buildTabs(op), pre = el("pre", "code");
  pre.setAttribute("aria-label", "Code"); if (op.libs) pre.setAttribute("role", "tabpanel");
  const rb = el("button", "tbtn", ICON.reset); rb.type = "button"; rb.setAttribute("aria-label", "Reset the code to its original values");
  rb.addEventListener("click", () => { hideTip(); resetOp(op); });
  rb.addEventListener("pointerenter", () => showTip(rb, '<span>Reset the code to its original values</span>')); rb.addEventListener("pointerleave", () => hideTip(80));
  rb.addEventListener("focus", () => showTip(rb, '<span>Reset the code to its original values</span>')); rb.addEventListener("blur", () => hideTip());
  tabs.bar.appendChild(rb);
  const pc = buildControls(op, "code");
  const foot2 = el("div", "cell-foot"), next2 = el("button", "btn btn-primary", `Run ${ICON.play}`), st2 = el("span", "cell-status");
  next2.type = "button"; foot2.append(next2, st2);

  b3.appendChild(el("p", "", esc(op.look)));

  const card3 = el("div", "snippet"), bar3 = el("div", "tabs"), lab3 = el("span", "tab static"), pre3 = el("pre", "code");

  run3.type = "button"; foot3.append(run3, st3);

  tipOn(rb3, op.reset3 ? "Undo this cell: put A back to the original image" : "Reset the code to its original values");
  rb3.addEventListener("click", () => { hideTip(); if (op.reset3) { op.reset3(op.s); op.ran3 = 0; update(op, true); } else resetOp(op); });

  }

  [pre, pre3].forEach(pre => {
  const tokenOf = e => e.target.closest(".tk, .pm");
  pre.addEventListener("pointerover", e => { const t = tokenOf(e); if (!t) return; if (t.classList.contains("pm")) highlight(t.dataset.key); const anchor = t.querySelector("input, select") || t; if (tipFor && tipFor.matches(":focus") && tipFor !== anchor) return; showTip(anchor, tipHtmlFor(t)); });

function applyStep(op, animate) {

/* bring a step's heading to the top of the visible area, below the header and, on phones, below the pinned image panel */
function scrollToStep(s) {

let pend = false;
function update(op, now, editing) {

    pend = false;
    if (op.libs) op.s.lib = LIB;
    try { op.run(op.s, op.v); } catch (e) { console.error(e); $("readout").textContent = "This step hit an error: " + e.message; }
    const host = editing && editing.closest("pre");
    [op.dom.code, op.dom.code3].forEach(p => {
      if (p === host) p.querySelectorAll(`.pm-in[data-key="${editing.dataset.key}"]`).forEach(x => { if (x !== editing) { x.value = editing.value; x.style.width = editing.style.width; x.closest(".pm").classList.remove("bad"); } });

/* ---------- routing ---------- */

/* ---------- image source ---------- */
function setSource(img, name) {

  if (cur) update(cur, true);
}
function onFile(e) {

    x.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, N, N); URL.revokeObjectURL(url);
